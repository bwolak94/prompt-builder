# PromptBase — Astro application service
#
# Must be used together with docker-compose.supabase.yml so that the
# `supabase-net` network and the `kong` service exist.
#
# Start everything:
#   docker compose \
#     -f docker-compose.supabase.yml \
#     -f docker-compose.app.yml \
#     --env-file .env.local \
#     up -d --build
#
# Stop:
#   docker compose \
#     -f docker-compose.supabase.yml \
#     -f docker-compose.app.yml \
#     --env-file .env.local \
#     down

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into client-side bundle — browser uses host-exposed Kong on :8000
        PUBLIC_SUPABASE_URL: http://localhost:8000
        PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
    image: promptbase-app:local
    restart: unless-stopped
    ports:
      - '3000:4321'
    networks:
      - supabase-net
    depends_on:
      kong:
        condition: service_started
    environment:
      # ── Supabase ──────────────────────────────────────────────────────────
      # Server-side SSR uses Docker internal DNS; overrides the build-time value.
      PUBLIC_SUPABASE_URL: http://kong:8000
      PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      # ── AI providers ──────────────────────────────────────────────────────
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_SCORE_PROVIDER: ${AI_SCORE_PROVIDER:-openai}
      # ── Site ──────────────────────────────────────────────────────────────
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      # ── Server ────────────────────────────────────────────────────────────
      HOST: 0.0.0.0
      PORT: 4321
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4321/ > /dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
