# HTTP → HTTPS redirect
# Used during initial setup before SSL certs are obtained.
# After certs are ready, the main nginx.conf takes over.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge (needed to obtain the first cert)
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
      return 301 https://$host$request_uri;
    }
  }
}
