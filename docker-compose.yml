# PromptBase — Production docker-compose
#
# Usage:
#   docker compose --env-file .env.production up -d --build
#
# Required .env.production vars:
#   DOMAIN, ANON_KEY, SERVICE_ROLE_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY,
#   SITE_URL, PUBLIC_SUPABASE_URL, PUBLIC_SUPABASE_ANON_KEY

services:
  # ── Astro application ────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL}
        PUBLIC_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY}
    image: promptbase-app:latest
    restart: unless-stopped
    networks:
      - app-net
    environment:
      PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL}
      PUBLIC_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_SCORE_PROVIDER: ${AI_SCORE_PROVIDER:-openai}
      SITE_URL: ${SITE_URL}
      HOST: 0.0.0.0
      PORT: 4321
      NODE_ENV: production
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4321/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Nginx reverse proxy with SSL ─────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    networks:
      - app-net
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      app:
        condition: service_healthy

  # ── Certbot for Let's Encrypt SSL ────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    restart: 'no'
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    # Run manually to obtain/renew certs:
    #   docker compose run --rm certbot certonly --webroot \
    #     --webroot-path /var/www/certbot \
    #     -d ${DOMAIN} --email admin@${DOMAIN} --agree-tos --non-interactive
    command: echo "Certbot container ready. Run manually to issue/renew certificates."

volumes:
  certbot-www:
  certbot-certs:

networks:
  app-net:
    driver: bridge
