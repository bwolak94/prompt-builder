<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PromptBase — Settings</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        color: #111827;
        background: #f9fafb;
        min-height: 100vh;
        padding: 32px 0;
      }

      .page {
        max-width: 520px;
        margin: 0 auto;
        background: #fff;
        border-radius: 12px;
        border: 1px solid #e5e7eb;
        overflow: hidden;
      }

      .page-header {
        padding: 20px 24px;
        border-bottom: 1px solid #e5e7eb;
      }
      .page-header h1 {
        font-size: 18px;
        font-weight: 700;
        color: #6366f1;
        letter-spacing: -0.3px;
      }
      .page-header p {
        margin-top: 3px;
        font-size: 13px;
        color: #6b7280;
      }

      .section {
        padding: 20px 24px;
        border-bottom: 1px solid #f3f4f6;
      }
      .section:last-child { border-bottom: none; }
      .section-title {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: #9ca3af;
        margin-bottom: 12px;
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: #374151;
        margin-bottom: 5px;
      }
      .hint {
        font-size: 12px;
        color: #9ca3af;
        margin-bottom: 8px;
      }

      input[type="url"],
      input[type="text"] {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #d1d5db;
        border-radius: 7px;
        font-size: 13px;
        outline: none;
        transition: border-color 0.15s;
      }
      input:focus { border-color: #6366f1; }

      .row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      button {
        padding: 7px 16px;
        border-radius: 7px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.12s;
        border: none;
      }
      .btn-primary { background: #6366f1; color: #fff; }
      .btn-primary:hover { background: #4f46e5; }
      .btn-secondary {
        background: #f3f4f6;
        color: #374151;
        border: 1px solid #e5e7eb;
      }
      .btn-secondary:hover { background: #e5e7eb; }

      /* Status badge */
      .status-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: #f9fafb;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
      }
      .dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .dot.ok { background: #22c55e; }
      .dot.err { background: #ef4444; }
      .dot.checking {
        background: #f59e0b;
        animation: pulse 1s infinite;
      }
      @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.4 } }
      .status-text { font-size: 13px; color: #374151; }
      .status-link { margin-left: auto; font-size: 12px; color: #6366f1; text-decoration: none; }
      .status-link:hover { text-decoration: underline; }

      .feedback {
        margin-top: 8px;
        font-size: 12px;
        color: #22c55e;
        min-height: 16px;
      }
      .feedback.error { color: #ef4444; }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="page-header">
        <h1>PromptBase</h1>
        <p>Extension settings</p>
      </div>

      <!-- Host configuration -->
      <div class="section">
        <div class="section-title">Server</div>
        <label for="hostInput">PromptBase URL</label>
        <div class="hint">The URL where your PromptBase instance is running.</div>
        <input
          type="url"
          id="hostInput"
          placeholder="http://localhost:3000"
          autocomplete="off"
        />
        <div class="row">
          <button class="btn-primary" id="saveBtn">Save</button>
          <button class="btn-secondary" id="resetBtn">Reset to default</button>
        </div>
        <div class="feedback" id="saveFeedback"></div>
      </div>

      <!-- Auth status -->
      <div class="section">
        <div class="section-title">Authentication</div>
        <div class="status-row">
          <div class="dot checking" id="statusDot"></div>
          <span class="status-text" id="statusText">Checking…</span>
          <a class="status-link" id="openAppBtn" href="#" target="_blank">Open app</a>
        </div>
        <div class="row" style="margin-top:12px">
          <button class="btn-secondary" id="recheckBtn">Check again</button>
        </div>
      </div>

      <!-- About -->
      <div class="section">
        <div class="section-title">About</div>
        <p style="font-size:13px; color:#6b7280; line-height:1.5">
          PromptBase extension v0.1.0 — Quickly access your prompt library and insert prompts into any AI chat.
        </p>
      </div>
    </div>

    <script type="module" src="./options.ts"></script>
  </body>
</html>
