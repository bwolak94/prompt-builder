<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PromptBase</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 360px;
        min-height: 480px;
        max-height: 600px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        color: #111827;
        background: #fff;
        display: flex;
        flex-direction: column;
      }

      /* Header */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px 10px;
        border-bottom: 1px solid #e5e7eb;
      }
      .logo {
        font-weight: 700;
        font-size: 15px;
        color: #6366f1;
        letter-spacing: -0.3px;
      }
      .header-actions { display: flex; gap: 6px; }
      .icon-btn {
        background: none;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 4px 8px;
        cursor: pointer;
        font-size: 12px;
        color: #6b7280;
        transition: background 0.12s;
      }
      .icon-btn:hover { background: #f3f4f6; color: #111827; }

      /* Auth banner */
      .auth-banner {
        display: none;
        padding: 12px 14px;
        background: #fef3c7;
        color: #92400e;
        font-size: 13px;
        gap: 8px;
        align-items: center;
      }
      .auth-banner.visible { display: flex; }
      .auth-banner a {
        margin-left: auto;
        color: #6366f1;
        text-decoration: none;
        font-weight: 500;
      }
      .auth-banner a:hover { text-decoration: underline; }

      /* Search */
      .search-wrap {
        padding: 10px 14px 8px;
        border-bottom: 1px solid #f3f4f6;
      }
      .search-input {
        width: 100%;
        padding: 7px 10px;
        border: 1px solid #d1d5db;
        border-radius: 7px;
        font-size: 13px;
        outline: none;
        transition: border-color 0.15s;
      }
      .search-input:focus { border-color: #6366f1; }

      /* List */
      .list-wrap {
        flex: 1;
        overflow-y: auto;
        padding: 4px 0;
      }
      .prompt-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 14px;
        cursor: pointer;
        transition: background 0.1s;
        border-bottom: 1px solid #f9fafb;
      }
      .prompt-item:hover { background: #f5f3ff; }
      .prompt-meta { flex: 1; min-width: 0; }
      .prompt-title {
        font-weight: 500;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #111827;
      }
      .prompt-tags {
        margin-top: 2px;
        font-size: 11px;
        color: #9ca3af;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .insert-btn {
        flex-shrink: 0;
        padding: 4px 10px;
        background: #6366f1;
        color: #fff;
        border: none;
        border-radius: 5px;
        font-size: 12px;
        cursor: pointer;
        transition: background 0.12s;
      }
      .insert-btn:hover { background: #4f46e5; }
      .insert-btn:active { background: #4338ca; }

      /* Empty / loading states */
      .state-msg {
        padding: 32px 16px;
        text-align: center;
        color: #9ca3af;
        font-size: 13px;
      }
      .spinner {
        display: inline-block;
        width: 20px; height: 20px;
        border: 2px solid #e5e7eb;
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        margin-bottom: 8px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Toast */
      .toast {
        position: fixed;
        bottom: 10px; left: 50%;
        transform: translateX(-50%) translateY(8px);
        background: #111827;
        color: #fff;
        padding: 7px 14px;
        border-radius: 7px;
        font-size: 12px;
        opacity: 0;
        transition: opacity 0.2s, transform 0.2s;
        pointer-events: none;
        z-index: 100;
        white-space: nowrap;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <header class="header">
      <span class="logo">PromptBase</span>
      <div class="header-actions">
        <button class="icon-btn" id="refreshBtn" title="Refresh">↻</button>
        <button class="icon-btn" id="optionsBtn" title="Settings">⚙</button>
      </div>
    </header>

    <div class="auth-banner" id="authBanner">
      <span>Sign in to use PromptBase.</span>
      <a id="openAppLink" href="#" target="_blank">Open app →</a>
    </div>

    <div class="search-wrap">
      <input
        class="search-input"
        id="searchInput"
        type="search"
        placeholder="Search prompts…"
        autocomplete="off"
      />
    </div>

    <div class="list-wrap" id="listWrap">
      <div class="state-msg" id="stateMsg">
        <div class="spinner"></div>
        <div>Loading…</div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
